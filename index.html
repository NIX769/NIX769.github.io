<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>单词过滤</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fafafa; color: #212121; margin: 0;
    padding: 14px 16px calc(10px + env(safe-area-inset-bottom));
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .top { display: flex; align-items: center; gap: 8px; }
  .ham {
    background: transparent; border: none; color: #455A64;
    font-size: 26px; line-height: 1; padding: 6px 10px 6px 2px; cursor: pointer;
  }
  .progress { flex: 1; color: #616161; font-size: 15px; }
  .small {
    background: #455A64; color: #fff; border: none; border-radius: 8px;
    font-size: 13px; padding: 9px 12px; cursor: pointer;
  }
  .small:active { opacity: .8; }
  .card {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 10px 0;
  }
  .word {
    font-size: 50px; font-weight: 700; line-height: 1.25;
    word-break: break-word; max-width: 100%;
  }
  .count { margin-top: 10px; color: #757575; font-size: 17px; }
  .meaning {
    margin-top: 22px; font-size: 23px; line-height: 1.5;
    min-height: 60px; color: #bdbdbd; max-width: 100%;
  }
  .meaning.show { color: #1B5E20; font-weight: 600; }

  /* 圆形顺时针倒计时 */
  .timer { position: relative; width: 80px; height: 80px; margin-top: 14px; }
  .timer svg { display: block; transform: rotate(-90deg); }
  .ringBg { fill: none; stroke: #E0E0E0; stroke-width: 7; }
  .ringFg {
    fill: none; stroke: #1565C0; stroke-width: 7; stroke-linecap: round;
    stroke-dasharray: 201.06; stroke-dashoffset: 0;
  }
  .timerNum {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700; color: #455A64;
  }

  .nav { display: flex; gap: 10px; margin-bottom: 10px; }
  .nav button {
    flex: 1; height: 56px; border: none; border-radius: 12px;
    color: #fff; font-size: 18px; cursor: pointer;
  }
  .nav button:active { opacity: .85; }
  .prev { background: #5C6BC0; }
  .next { background: #1565C0; }
  .restart { background: #6D4C41; }
  .back { background: #78909C; }
  .btns { display: flex; gap: 10px; }
  .btns button {
    flex: 1; height: 72px; border: none; border-radius: 12px;
    color: #fff; font-size: 21px; cursor: pointer;
  }
  .btns button:active { opacity: .85; }
  .k { background: #2E7D32; }
  .u { background: #C62828; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .options button {
    min-height: 66px; border: none; border-radius: 12px; background: #546E7A;
    color: #fff; font-size: 17px; line-height: 1.35; padding: 8px 6px; cursor: pointer;
  }
  .options button:active { opacity: .85; }
  .options button.correct { background: #2E7D32; }
  .options button.wrong { background: #C62828; opacity: .55; }
  .footer { display: flex; gap: 8px; margin-top: 12px; }
  .footer .small { flex: 1; background: #78909C; padding: 9px 4px; }
  .status { text-align: center; color: #9E9E9E; font-size: 12px; margin-top: 9px; }
  .byline {
    text-align: center; color: #BDBDBD; font-size: 13px;
    margin-top: 14px; letter-spacing: 1px;
  }
  .hidden { display: none !important; }

  /* 菜单 */
  #menu {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(0,0,0,.45);
  }
  .menuBox {
    position: absolute; left: 0; top: 0; bottom: 0; width: 255px;
    background: #fff; padding: 18px 14px; display: flex; flex-direction: column; gap: 8px;
    overflow-y: auto;
  }
  .menuTitle { font-size: 14px; color: #9E9E9E; margin-bottom: 4px; }
  .menuItem {
    text-align: left; padding: 13px 12px; font-size: 16px;
    background: #F5F5F5; border: none; border-radius: 10px; color: #212121; cursor: pointer;
  }
  .menuItem.active { background: #1565C0; color: #fff; }
  .menuClose {
    margin-top: auto; padding: 12px; font-size: 15px;
    background: #E0E0E0; border: none; border-radius: 10px; color: #616161; cursor: pointer;
  }

  /* 记录列表面板 */
  #panel {
    position: fixed; inset: 0; z-index: 50; background: #fafafa;
    display: none; flex-direction: column;
    padding: 14px 16px calc(10px + env(safe-area-inset-bottom));
  }
  #panel.open { display: flex; }
  .panelTitle { font-size: 17px; font-weight: 700; }
  .panelBtns { display: flex; gap: 8px; margin: 12px 0 8px; }
  .panelBtns button { flex: 1; padding: 10px 2px; border: none; border-radius: 8px; font-size: 13px; color: #fff; background: #1565C0; cursor: pointer; }
  .panelBtns button.alt { background: #78909C; }
  .filters { display: flex; gap: 8px; margin: 6px 0 4px; }
  .filters button {
    flex: 1; padding: 9px 0; border: none; border-radius: 8px;
    background: #E0E0E0; color: #424242; font-size: 14px; cursor: pointer;
  }
  .filters button.active { background: #455A64; color: #fff; }
  #panelList { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .row {
    display: flex; align-items: center; gap: 9px;
    padding: 11px 6px; border-bottom: 1px solid #EEEEEE; font-size: 15px;
    cursor: pointer;
  }
  .row:active { background: #EEEEEE; }
  .row .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .row .dot.k { background: #2E7D32; }
  .row .dot.u { background: #C62828; }
  .row .dot.v { background: #EF6C00; }
  .row b { font-size: 16px; flex: none; }
  .row .m { color: #616161; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .c { color: #9E9E9E; font-size: 12px; flex: none; }
  .empty { text-align: center; color: #BDBDBD; padding: 40px 0; }

  /* ===== 背单词：词组选择 ===== */
  #picker {
    position: fixed; inset: 0; z-index: 70;
    background: rgba(0,0,0,.45);
    display: none; align-items: center; justify-content: center;
    padding: 16px;
  }
  #picker.open { display: flex; }
  .pickerBox {
    background: #fff; border-radius: 16px; width: 100%; max-width: 430px;
    max-height: 84vh; padding: 18px 16px 14px;
    display: flex; flex-direction: column;
    overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch;
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
  }
  .pickerTitle { font-size: 18px; font-weight: 700; color: #212121; }
  .pickerHint { color: #9E9E9E; font-size: 12px; line-height: 1.5; margin-top: 4px; }
  .pickerList {
    margin: 10px 0 2px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: 8px;
    flex: none; min-height: 0;
    max-height: calc(84vh - 175px);
  }
  .groupBtn {
    display: flex; align-items: center; gap: 10px; text-align: left;
    padding: 10px 12px; border: 1px solid #E0E0E0; background: #FAFAFA;
    border-radius: 12px; cursor: pointer; flex: none; font-family: inherit;
  }
  .groupBtn:active { background: #EEEEEE; }
  .groupBtn .badge {
    flex: none; background: #1565C0; color: #fff; font-size: 13px; font-weight: 700;
    border-radius: 8px; padding: 7px 9px; min-width: 52px; text-align: center;
  }
  .groupBtn .info { flex: 1; min-width: 0; }
  .groupBtn .info b { display: block; font-size: 15px; color: #212121; }
  .groupBtn .info span {
    display: block; color: #9E9E9E; font-size: 12px; margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .groupBtn .num { flex: none; color: #616161; font-size: 13px; }
  .rangeRow { display: flex; align-items: center; gap: 10px; margin: 16px 0 0; }
  .rangeRow input {
    flex: 1; min-width: 0; height: 54px; border: 1px solid #CFD8DC;
    border-radius: 10px; background: #FAFAFA; color: #212121;
    text-align: center; font-size: 21px; font-weight: 700; font-family: inherit;
  }
  .rangeRow input:focus { outline: none; border-color: #1565C0; background: #fff; }
  .rangeRow input::-webkit-outer-spin-button,
  .rangeRow input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .rangeRow input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  .rangeRow span { flex: none; color: #757575; font-size: 15px; }
  .rangeHint { color: #9E9E9E; font-size: 12px; margin-top: 9px; text-align: center; line-height: 1.6; }
  .rangeHint b { color: #1565C0; }
  .pickerActions { display: flex; gap: 8px; margin-top: 14px; }
  .pickerActions button {
    flex: 1; height: 46px; border: none; border-radius: 10px;
    font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .pickerActions .ghost { background: #ECEFF1; color: #546E7A; }
  .pickerActions .primary { background: #1565C0; color: #fff; font-weight: 600; }
  .pickerActions button:active { opacity: .8; }

  /* ===== 背单词：卡片操作栏 ===== */
  #memoBtns button { height: 64px; font-size: 17px; }
  #memoBtns button:disabled { opacity: .38; }
</style>
</head>
<body>

<div class="top">
  <button class="ham" id="menuBtn" aria-label="菜单">☰</button>
  <div class="progress" id="progress">第 1 / 0 · 已标记 0</div>
  <button class="small" id="listBtn">记录</button>
  <button class="small" id="jumpBtn">跳转</button>
</div>

<div class="card">
  <div class="word" id="word">单词过滤</div>
  <div class="timer hidden" id="timer">
    <svg width="80" height="80" viewBox="0 0 80 80">
      <circle class="ringBg" cx="40" cy="40" r="32"></circle>
      <circle class="ringFg" id="ringFg" cx="40" cy="40" r="32"></circle>
    </svg>
    <div class="timerNum" id="timerNum">5</div>
  </div>
  <div class="count" id="count">出现次数：0</div>
  <div class="meaning" id="meaning">按下按钮后显示中文</div>
</div>

<div class="nav" id="nav">
  <button class="prev" id="prevBtn">← 上一个</button>
  <button class="next" id="nextBtn">下一个 →</button>
  <button class="back" id="backBtn" style="display:none">← 回到单词</button>
  <button class="restart" id="restartBtn" style="display:none">重新开始 ↺</button>
</div>

<div class="btns" id="btns">
  <button class="k" id="btnKnow">认识</button>
  <button class="u" id="btnUnknown">不认识</button>
</div>

<div class="btns hidden" id="memoBtns">
  <button class="back" id="memoPrev">← 上一个</button>
  <button class="k" id="memoReveal">显示中文</button>
  <button class="next" id="memoNext">下一个 →</button>
</div>

<div class="options hidden" id="options">
  <button id="opt0"></button>
  <button id="opt1"></button>
  <button id="opt2"></button>
  <button id="opt3"></button>
</div>

<div class="footer" id="footerTest">
  <button class="small" id="importBtn">导入TXT</button>
  <button class="small" id="exportBtn">导出记录</button>
  <button class="small" id="resetBtn">清空记录</button>
</div>

<div class="footer hidden" id="footerQuiz">
  <button class="small" id="quizImportBtn">导入记录TXT</button>
  <button class="small" id="quizUseBtn">用当前记录</button>
  <button class="small" id="quizShuffleBtn">重排抽题</button>
</div>

<div class="footer hidden" id="footerMemo">
  <button class="small" id="memoPickBtn">换个词组</button>
  <button class="small" id="memoKindBtn">切到选择题</button>
  <button class="small" id="memoRestartBtn">重来本轮</button>
</div>

<div class="status" id="status">导出的记录文件含进度，可再导入接着背</div>
<div class="byline">by NIX7</div>

<!-- 功能菜单 -->
<div id="menu" class="hidden">
  <div class="menuBox">
    <div class="menuTitle">功能菜单</div>
    <button class="menuItem active" data-mode="test">① 测试</button>
    <button class="menuItem" data-mode="quizKnown">② 认识词测试</button>
    <button class="menuItem" data-mode="quizUnknown">③ 不认识词学习</button>
    <button class="menuItem" data-mode="timedKnown">④ 限时认识词</button>
    <button class="menuItem" data-mode="timedUnknown">⑤ 限时不认识词</button>
    <button class="menuItem" data-mode="timedMixed">⑥ 混合限时</button>
    <button class="menuItem" data-mode="memo">⑦ 背单词</button>
    <button class="menuClose" id="menuClose">关闭</button>
  </div>
</div>

<!-- 记录列表面板 -->
<div id="panel">
  <div class="top">
    <div class="panelTitle" id="panelTitle">单词记录</div>
    <button class="small" id="panelClose">关闭</button>
  </div>
  <div class="panelBtns">
    <button id="panelImport">导入记录文件</button>
    <button id="panelExport">导出记录</button>
    <button class="alt" id="panelClear">清空</button>
  </div>
  <div class="filters">
    <button data-f="all" class="active">全部</button>
    <button data-f="unknown">不认识</button>
    <button data-f="known">认识</button>
  </div>
  <div id="panelList"></div>
</div>

<!-- 背单词：先选词组，再填范围 -->
<div id="picker">
  <div class="pickerBox">
    <div id="pickerStep1">
      <div class="pickerTitle">背单词 · 选择词组</div>
      <div class="pickerHint" id="pickerHint">按出现次数分类，点一组开始</div>
      <div class="pickerList" id="pickerList"></div>
      <div class="pickerActions">
        <button class="ghost" id="pickerImport">导入记录TXT</button>
        <button class="ghost" id="pickerUse">用当前记录</button>
        <button class="ghost" id="pickerClose">关闭</button>
      </div>
    </div>
    <div id="pickerStep2" class="hidden">
      <div class="pickerTitle" id="rangeTitle">选择范围</div>
      <div class="pickerHint">填入要背的范围：从第几个到第几个</div>
      <div class="rangeRow">
        <input type="number" id="rangeFrom" inputmode="numeric" min="0" value="1">
        <span>到</span>
        <input type="number" id="rangeTo" inputmode="numeric" min="0" value="0">
      </div>
      <div class="rangeHint" id="rangeHint">共 0 个词</div>
      <div class="pickerActions">
        <button class="ghost" id="rangeBack">返回词组</button>
        <button class="primary" id="rangeStart">开始背</button>
      </div>
    </div>
  </div>
</div>

<input type="file" id="fileInputLib" class="hidden" accept=".txt,text/plain">
<input type="file" id="fileInputRec" class="hidden" accept=".txt,text/plain">
<input type="file" id="fileInputQuiz" class="hidden" accept=".txt,text/plain">

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var wordEl = $('word'), countEl = $('count'), meaningEl = $('meaning');
  var progressEl = $('progress'), statusEl = $('status');
  var navEl = $('nav'), btnsEl = $('btns'), optionsEl = $('options');
  var timerEl = $('timer'), ringFg = $('ringFg'), timerNum = $('timerNum');
  var footerTest = $('footerTest'), footerQuiz = $('footerQuiz');
  var navBtns = { prev: $('prevBtn'), next: $('nextBtn'), back: $('backBtn'), restart: $('restartBtn') };
  var btnKnow = $('btnKnow'), btnUnknown = $('btnUnknown');
  var fileInputLib = $('fileInputLib'), fileInputRec = $('fileInputRec'), fileInputQuiz = $('fileInputQuiz');
  var panel = $('panel'), panelList = $('panelList'), panelTitle = $('panelTitle');
  var menuEl = $('menu');
  var optEls = [$('opt0'), $('opt1'), $('opt2'), $('opt3')];
  var memoBtns = $('memoBtns'), footerMemo = $('footerMemo'), pickerEl = $('picker');
  var cardEl = document.querySelector('.card');

  var words = [];
  var answers = {};
  var pos = 0;
  var finished = false;
  var sourceText = '';
  var sourceName = '内置词库：广东3+证书英语2016-2026真题全部词汇';
  var panelFilter = 'all';
  var mode = 'test';

  var TIMED_MS = 5000;
  var RING_C = 2 * Math.PI * 32;

  // ================= 解析 =================
  function parseWordLine(line) {
    line = String(line).replace(/^\uFEFF/, '').trim();
    if (!line || line.charAt(0) === '#') return null;
    var sp = line.indexOf(' ');
    if (sp < 0) return { w: line, m: '', c: 0 };
    var w = line.slice(0, sp);
    var rest = line.slice(sp + 1).trim();
    var c = 0;
    var lastSp = rest.lastIndexOf(' ');
    if (lastSp >= 0) {
      var last = rest.slice(lastSp + 1).trim();
      if (/^\d+$/.test(last)) {
        c = parseInt(last, 10);
        rest = rest.slice(0, lastSp).trim();
      }
    }
    return { w: w, m: rest, c: c };
  }

  function parseText(text) {
    var out = [];
    var lines = String(text).split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
      var item = parseWordLine(lines[i]);
      if (item) out.push(item);
    }
    return out;
  }

  function parseRecord(text) {
    var lines = String(text).split(/\r?\n/);
    var section = null, progress = null, recs = [], hasMark = false;
    for (var i = 0; i < lines.length; i++) {
      var line = String(lines[i]).replace(/^\uFEFF/, '').trim();
      if (!line) continue;
      if (line.charAt(0) === '#') {
        var body = line.slice(1).trim();
        if (body.indexOf('不认识') === 0) { section = 'unknown'; hasMark = true; }
        else if (body.indexOf('不熟悉') === 0) { section = 'vague'; hasMark = true; }
        else if (body.indexOf('认识') === 0) { section = 'known'; hasMark = true; }
        else if (body.indexOf('进度') === 0) {
          hasMark = true;
          var n = parseInt(body.replace(/\D/g, ''), 10);
          if (!isNaN(n)) progress = n;
        }
        continue;
      }
      var item = parseWordLine(line);
      if (item && section) recs.push({ w: item.w, m: item.m, c: item.c, cat: section });
    }
    return hasMark ? { progress: progress, recs: recs } : null;
  }

  // ================= 保存/恢复 =================
  function save() {
    try {
      localStorage.setItem('vocabfilter_state', JSON.stringify({
        text: sourceText, name: sourceName, answers: answers, pos: pos, mode: mode
      }));
    } catch (e) {}
  }

  function saveQuiz() {
    try {
      localStorage.setItem('vocabfilter_quiz', JSON.stringify({
        known: quizKnown.pool, unknown: quizUnknown.pool, groupSize: quizGroupSize,
        memoKind: memo.kind
      }));
    } catch (e) {}
  }

  function firstUnanswered(from) {
    for (var i = (from || 0); i < words.length; i++) {
      if (!answers[words[i].w]) return i;
    }
    for (var j = 0; j < words.length; j++) {
      if (!answers[words[j].w]) return j;
    }
    return -1;
  }

  function restore() {
    try {
      var raw = localStorage.getItem('vocabfilter_state');
      if (!raw) return false;
      var st = JSON.parse(raw);
      if (!st || !st.text) return false;
      sourceText = st.text;
      sourceName = st.name || '已导入的词库';
      answers = st.answers || {};
      words = parseText(sourceText);
      if (words.length === 0) return false;
      pos = (typeof st.pos === 'number') ? st.pos : Math.max(0, firstUnanswered(0));
      if (pos < 0 || pos >= words.length) pos = 0;
      if (MODES.indexOf(st.mode) >= 0) mode = st.mode;
      return true;
    } catch (e) { return false; }
  }

  function restoreQuiz() {
    try {
      var raw = localStorage.getItem('vocabfilter_quiz');
      if (!raw) return;
      var q = JSON.parse(raw);
      if (q && q.known) quizKnown.pool = q.known;
      if (q && q.unknown) quizUnknown.pool = q.unknown;
      if (q && typeof q.groupSize === 'number') { quizGroupSize = q.groupSize; groupSizeSaved = true; }
      if (q && (q.memoKind === 'card' || q.memoKind === 'choice')) memo.kind = q.memoKind;
    } catch (e) {}
  }

  function doneCount() {
    var n = 0;
    for (var k in answers) if (answers.hasOwnProperty(k)) n++;
    return n;
  }

  function countOf(cat) {
    var n = 0;
    for (var k in answers) if (answers.hasOwnProperty(k) && answers[k] === cat) n++;
    return n;
  }

  // ================= 测试模式 =================
  function showCurrent() {
    if (finished) { showDone(); return; }
    var w = words[pos];
    var cat = answers[w.w];
    wordEl.textContent = w.w;
    countEl.textContent = '出现次数：' + w.c;

    if (cat) {
      meaningEl.textContent = w.m ? w.m : '（无中文释义）';
      meaningEl.className = 'meaning show';
    } else {
      meaningEl.textContent = '按下按钮后显示中文';
      meaningEl.className = 'meaning';
    }

    btnKnow.textContent = (cat === 'known') ? '✓ 认识' : '认识';
    btnUnknown.textContent = (cat === 'unknown') ? '✓ 不认识' : '不认识';

    btnsEl.style.display = 'flex';
    navBtns.prev.style.display = 'block';
    navBtns.next.style.display = 'block';
    navBtns.back.style.display = 'none';
    navBtns.restart.style.display = 'none';

    progressEl.textContent = '第 ' + (pos + 1) + ' / ' + words.length + ' · 已标记 ' + doneCount();
  }

  function showDone() {
    finished = true;
    wordEl.textContent = '全部完成 🎉';
    countEl.textContent = '认识 ' + countOf('known') + ' · 不认识 ' + countOf('unknown') +
      (countOf('vague') ? ' · 不熟悉 ' + countOf('vague') : '');
    meaningEl.textContent = '点「导出记录」保存记录文件';
    meaningEl.className = 'meaning show';
    btnsEl.style.display = 'none';
    navBtns.prev.style.display = 'none';
    navBtns.next.style.display = 'none';
    navBtns.back.style.display = 'block';
    navBtns.restart.style.display = 'block';
    progressEl.textContent = '第 ' + words.length + ' / ' + words.length + ' · 已标记 ' + doneCount();
    statusEl.textContent = '导出的记录文件在浏览器下载目录，可再导入接着背';
  }

  function answer(cat) {
    if (finished || pos >= words.length) return;
    var w = words[pos];
    answers[w.w] = cat;
    save();
    showCurrent();
    if (panel.classList.contains('open')) renderPanel();
    statusEl.textContent = '已标记「' + w.w + '」为' + (cat === 'known' ? '认识' : '不认识') + '，可改按其它键修改';
  }

  function goNext() {
    if (finished) return;
    if (pos + 1 >= words.length) { showDone(); return; }
    pos++;
    save();
    showCurrent();
  }

  function goPrev() {
    if (finished) return;
    if (pos > 0) pos--;
    save();
    showCurrent();
  }

  function jump() {
    var s = window.prompt('跳到第几个单词？（1 - ' + words.length + '）', String(pos + 1));
    if (s === null) return;
    var n = parseInt(String(s).trim(), 10);
    if (isNaN(n) || n < 1 || n > words.length) {
      statusEl.textContent = '请输入 1 到 ' + words.length + ' 之间的数字';
      return;
    }
    gotoIndex(n - 1);
    statusEl.textContent = '已跳到第 ' + n + ' 个单词';
  }

  function gotoIndex(i) {
    finished = false;
    pos = i;
    save();
    showCurrent();
  }

  function resetAll() {
    if (!window.confirm('确定清空全部作答记录并重新开始吗？')) return;
    answers = {};
    pos = 0;
    finished = false;
    save();
    showCurrent();
    if (panel.classList.contains('open')) renderPanel();
    statusEl.textContent = '已清空记录，词库：' + sourceName;
  }

  function goBack() {
    finished = false;
    pos = Math.min(pos, words.length - 1);
    showCurrent();
  }

  // ================= 导出 =================
  function download(name, text) {
    var blob = new Blob(['\uFEFF' + text], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  function sectionLines(cat) {
    var lines = [];
    for (var i = 0; i < words.length; i++) {
      var w = words[i];
      if (answers[w.w] === cat) lines.push(w.w + ' ' + w.m + ' ' + w.c);
    }
    return lines;
  }

  function buildRecord() {
    var out = [];
    out.push('#单词过滤记录');
    out.push('#词库 ' + sourceName);
    out.push('#进度 ' + Math.min(pos + 1, words.length));
    out.push('#不认识');
    out = out.concat(sectionLines('unknown'));
    if (countOf('vague') > 0) {
      out.push('#不熟悉');
      out = out.concat(sectionLines('vague'));
    }
    out.push('#认识');
    out = out.concat(sectionLines('known'));
    return out.join('\n') + '\n';
  }

  function exportAll() {
    if (doneCount() === 0) { statusEl.textContent = '还没有作答记录，先按几个按钮吧'; return; }
    download('vocab_record.txt', buildRecord());
    statusEl.textContent = '已导出 vocab_record.txt（不认识在上、认识在下，含进度），可再导入接着背';
  }

  // ================= 导入 =================
  function applyRecord(rec, fileName) {
    var kept = 0, skipped = 0;
    var valid = {};
    for (var i = 0; i < words.length; i++) valid[words[i].w] = true;
    var merged = {};
    for (var j = 0; j < rec.recs.length; j++) {
      var r = rec.recs[j];
      if (valid[r.w]) { merged[r.w] = r.cat; kept++; } else skipped++;
    }
    answers = merged;
    var start = (rec.progress && rec.progress >= 1) ? Math.min(rec.progress - 1, words.length - 1) : 0;
    var idx = firstUnanswered(start);
    pos = (idx < 0) ? 0 : idx;
    finished = false;
    save();
    showCurrent();
    if (panel.classList.contains('open')) renderPanel();
    statusEl.textContent = '已从「' + fileName + '」恢复 ' + kept + ' 条记录' +
      (skipped ? '（' + skipped + ' 条不在当前词库，已忽略）' : '') +
      (rec.progress ? '，从第 ' + (pos + 1) + ' 个单词继续' : '');
  }

  function importLibFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var text = String(reader.result);
      var rec = parseRecord(text);
      if (rec) { applyRecord(rec, file.name); return; }
      var list = parseText(text);
      if (list.length === 0) { statusEl.textContent = '导入失败：文件里没有识别到单词'; return; }
      if (doneCount() > 0 && !window.confirm('导入新词库会清除当前作答记录，继续吗？')) return;
      words = list;
      sourceText = text;
      sourceName = '已导入：' + file.name;
      answers = {};
      pos = 0;
      finished = false;
      save();
      showCurrent();
      if (panel.classList.contains('open')) renderPanel();
      statusEl.textContent = '已导入词库 ' + file.name + '，共 ' + words.length + ' 个单词';
    };
    reader.onerror = function () { statusEl.textContent = '读取文件失败'; };
    reader.readAsText(file, 'UTF-8');
  }

  function importRecFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var rec = parseRecord(String(reader.result));
      if (!rec) { statusEl.textContent = '这个文件不是记录文件（缺少 #不认识/#认识 标记）'; return; }
      applyRecord(rec, file.name);
    };
    reader.onerror = function () { statusEl.textContent = '读取文件失败'; };
    reader.readAsText(file, 'UTF-8');
  }

  // ================= 抽题：公共 =================
  var MODES = ['test', 'quizKnown', 'quizUnknown', 'timedKnown', 'timedUnknown', 'timedMixed', 'memo'];

  function isTimed() { return mode === 'timedKnown' || mode === 'timedUnknown' || mode === 'timedMixed'; }

  function labelOf(m) {
    return {
      test: '测试', quizKnown: '认识词测试', quizUnknown: '不认识词学习',
      timedKnown: '限时认识词', timedUnknown: '限时不认识词', timedMixed: '混合限时',
      memo: '背单词'
    }[m] || m;
  }

  var quizKnown = { pool: [], deck: [], cur: null, qTotal: 0, qRight: 0, qWrong: 0, locked: false };
  var quizUnknown = { pool: [], deck: [], cur: null, qTotal: 0, qRight: 0, qWrong: 0, locked: false };
  var quizGroupSize = 0;      // 0 = 全部
  var groupSizeSaved = false;

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  // 当前模式的词库来源
  function poolForMode(m) {
    if (m === 'timedMixed') {
      var seen = {}, out = [];
      var src = [quizKnown.pool, quizUnknown.pool];
      for (var s = 0; s < src.length; s++) {
        for (var i = 0; i < src[s].length; i++) {
          var w = src[s][i];
          if (!seen[w.w]) { seen[w.w] = true; out.push(w); }
        }
      }
      return out;
    }
    return (m === 'quizUnknown' || m === 'timedUnknown' || m === 'memo') ? quizUnknown.pool : quizKnown.pool;
  }

  function quizOf() { return mode === 'quizUnknown' ? quizUnknown : quizKnown; }

  function renderQuestion(item, hint) {
    wordEl.textContent = item.w;
    meaningEl.textContent = hint;
    meaningEl.className = 'meaning';
    optionsEl.classList.remove('hidden');

    var correct = item.m;
    var seen = {};
    if (correct) seen[correct] = true;
    var distract = [];
    // 干扰项：每次从整个词库随机抽互不相同的 3 个
    var guard = 0;
    while (distract.length < 3 && guard++ < 60) {
      var pick = words[Math.floor(Math.random() * words.length)].m;
      if (pick && !seen[pick]) { seen[pick] = true; distract.push(pick); }
    }
    // 词库太小时兜底补齐
    for (var i = 0; i < words.length && distract.length < 3; i++) {
      var m = words[i].m;
      if (m && !seen[m]) { seen[m] = true; distract.push(m); }
    }
    var opts = shuffle([correct].concat(distract));
    for (var k = 0; k < 4; k++) {
      optEls[k].textContent = opts[k] || '';
      optEls[k].className = opts[k] ? '' : 'hidden';
      optEls[k].disabled = !opts[k];
    }
  }

  // ---------- 不限时抽题（认识词测试 / 不认识词学习） ----------
  function quizStart() {
    var q = quizOf();
    q.qTotal = 0; q.qRight = 0; q.qWrong = 0;
    q.cur = null; q.locked = false;
    var pool = poolForMode(mode);
    if (pool.length === 0) {
      wordEl.textContent = labelOf(mode);
      countEl.textContent = '还没有可用的单词';
      meaningEl.textContent = '';
      meaningEl.className = 'meaning';
      optionsEl.classList.add('hidden');
      progressEl.textContent = labelOf(mode);
      statusEl.textContent = '点下方「导入记录TXT」导入测试模式导出的文件，或点「用当前记录」';
      return;
    }
    quizResetDeck(q, pool);
    quizNext(pool);
  }

  function quizResetDeck(q, pool) {
    q.deck = shuffle(pool.slice());
    if (q.deck.length > 1 && q.cur && q.deck[0].w === q.cur.w) {
      var t = q.deck[0]; q.deck[0] = q.deck[1]; q.deck[1] = t;
    }
  }

  function quizNext(pool) {
    var q = quizOf();
    q.locked = false;
    pool = pool || poolForMode(mode);
    if (pool.length === 0) { quizStart(); return; }
    if (q.deck.length === 0) {
      quizResetDeck(q, pool);
      statusEl.textContent = '一轮抽完，重新打乱（会有少量重复）';
    }
    q.cur = q.deck.shift();
    q.qTotal++;
    renderQuestion(q.cur, '选出正确的中文意思');
    countEl.textContent = '第 ' + q.qTotal + ' 题 · 答对 ' + q.qRight + ' · 答错 ' + q.qWrong;
    progressEl.textContent = labelOf(mode) + ' · 词库 ' + pool.length + ' 个';
  }

  function quizAnswer(idx) {
    var q = quizOf();
    if (q.locked || !q.cur) return;
    var btn = optEls[idx];
    if (!btn.textContent) return;
    if (btn.textContent === q.cur.m) {
      btn.className = 'correct';
      q.qRight++;
      q.locked = true;
      for (var i = 0; i < 4; i++) optEls[i].disabled = true;
      statusEl.textContent = '✓ 答对了：' + q.cur.w + ' = ' + q.cur.m;
      setTimeout(function () { if (!isTimed() && mode !== 'test') quizNext(); }, 650);
    } else {
      btn.className = 'wrong';
      btn.disabled = true;
      q.qWrong++;
      statusEl.textContent = '✗ 不对，再想想「' + q.cur.w + '」的意思';
    }
    countEl.textContent = '第 ' + q.qTotal + ' 题 · 答对 ' + q.qRight + ' · 答错 ' + q.qWrong;
  }

  // ---------- 限时抽题 ----------
  var timed = {
    queue: [], cur: null, groupTotal: 0, qTotal: 0, qRight: 0, qWrong: 0, qTimeout: 0,
    mistakes: {}, locked: false, done: false, deadline: 0, raf: 0
  };

  function ringSet(frac, alarm) {
    ringFg.style.strokeDashoffset = String(RING_C * (1 - frac));
    ringFg.style.stroke = alarm ? '#C62828' : '#1565C0';
    timerNum.textContent = String(Math.max(0, Math.ceil(frac * TIMED_MS / 1000)));
  }

  function timerStop() {
    if (timed.raf) {
      if (window.cancelAnimationFrame) window.cancelAnimationFrame(timed.raf);
      else clearTimeout(timed.raf);
      timed.raf = 0;
    }
  }

  function timerTick() {
    if (timed.locked || timed.done || !timed.cur) return;
    var left = timed.deadline - Date.now();
    if (left <= 0) { ringSet(0, true); timedTimeout(); return; }
    ringSet(left / TIMED_MS, left <= 2000);
    timed.raf = (window.requestAnimationFrame)
      ? window.requestAnimationFrame(function () { timerTick(); })
      : setTimeout(function () { timerTick(); }, 60);
  }

  function timerStart() {
    timerStop();
    timed.deadline = Date.now() + TIMED_MS;
    ringSet(1, false);
    timerTick();
  }

  function timedStats() {
    return '第 ' + timed.qTotal + ' 题 · 剩余 ' + timed.queue.length +
      ' · 对 ' + timed.qRight + ' · 错 ' + timed.qWrong + ' · 超时 ' + timed.qTimeout;
  }

  function timedStart(askSize) {
    var pool = poolForMode(mode);
    timed.queue = []; timed.cur = null; timed.groupTotal = 0;
    timed.qTotal = 0; timed.qRight = 0; timed.qWrong = 0; timed.qTimeout = 0;
    timed.mistakes = {}; timed.locked = false; timed.done = false;
    timerStop();
    timerEl.classList.add('hidden');

    if (pool.length === 0) {
      wordEl.textContent = labelOf(mode);
      countEl.textContent = '还没有可用的单词';
      meaningEl.textContent = '';
      meaningEl.className = 'meaning';
      optionsEl.classList.add('hidden');
      progressEl.textContent = labelOf(mode);
      statusEl.textContent = '点下方「导入记录TXT」导入测试模式导出的文件，或点「用当前记录」';
      return;
    }

    if (askSize) {
      var s = window.prompt('每组单词数量（0 = 全部）', String(quizGroupSize));
      if (s !== null && String(s).trim() !== '') {
        var n = parseInt(String(s).trim(), 10);
        if (!isNaN(n) && n >= 0) { quizGroupSize = n; groupSizeSaved = true; saveQuiz(); }
      }
    }

    // 一组内单词不重复：从词库随机抽取
    var seen = {}, group = [];
    var shuffled = shuffle(pool.slice());
    for (var i = 0; i < shuffled.length; i++) {
      var w = shuffled[i];
      if (seen[w.w]) continue;
      seen[w.w] = true;
      group.push(w);
      if (quizGroupSize > 0 && group.length >= quizGroupSize) break;
    }
    timed.queue = group;
    timed.groupTotal = group.length;
    progressEl.textContent = labelOf(mode) + ' · 每组 ' + (quizGroupSize > 0 ? quizGroupSize : '全部') + ' 词';
    timedNext();
  }

  function timedNext() {
    timerStop();
    timed.locked = false;
    if (timed.done) return;
    if (timed.queue.length === 0) { timedDone(); return; }
    timed.cur = timed.queue.shift();
    timed.qTotal++;
    renderQuestion(timed.cur, '5 秒内选出正确的中文意思');
    countEl.textContent = timedStats();
    timerEl.classList.remove('hidden');
    timerStart();
  }

  function timedAnswer(idx) {
    if (timed.locked || timed.done || !timed.cur) return;
    var btn = optEls[idx];
    if (!btn.textContent) return;
    timerStop();
    timed.locked = true;
    if (btn.textContent === timed.cur.m) {
      btn.className = 'correct';
      for (var i = 0; i < 4; i++) optEls[i].disabled = true;
      timed.qRight++;
      statusEl.textContent = '✓ 答对了：' + timed.cur.w + ' = ' + timed.cur.m;
      countEl.textContent = timedStats();
      setTimeout(timedNext, 450);
    } else {
      btn.className = 'wrong';
      btn.disabled = true;
      timed.qWrong++;
      countEl.textContent = timedStats();
      timedMistake('答错');
    }
  }

  function timedTimeout() {
    if (timed.locked || timed.done || !timed.cur) return;
    timed.locked = true;
    timerStop();
    ringSet(0, true);
    timed.qTimeout++;
    countEl.textContent = timedStats();
    timedMistake('超时');
  }

  // 显示正确答案，并按规则补词：错1次插2个，2次3个，3次4个，4个封顶，随机插入后续
  function timedMistake(reason) {
    for (var i = 0; i < 4; i++) {
      if (optEls[i].textContent === timed.cur.m) optEls[i].className = 'correct';
      optEls[i].disabled = true;
    }
    statusEl.textContent = (reason === '超时' ? '⏰ 时间到！' : '✗ 答错了！') +
      '正确答案：' + timed.cur.m + '，稍后会再出现';

    var w = timed.cur.w;
    var n = (timed.mistakes[w] || 0) + 1;
    timed.mistakes[w] = n;
    var target = Math.min(n + 1, 4);
    var before = (n <= 1) ? 0 : Math.min(n, 4);
    var add = target - before;
    for (var k = 0; k < add; k++) {
      var at = Math.floor(Math.random() * (timed.queue.length + 1));
      timed.queue.splice(at, 0, { w: timed.cur.w, m: timed.cur.m, c: timed.cur.c });
    }
    setTimeout(timedNext, 1300);
  }

  function timedDone() {
    timerStop();
    timed.done = true;
    timed.cur = null;
    timerEl.classList.add('hidden');
    wordEl.textContent = '本组完成 🎉';
    countEl.textContent = '共 ' + timed.groupTotal + ' 词 · 出题 ' + timed.qTotal + ' 次 · 答对 ' + timed.qRight +
      ' · 答错 ' + timed.qWrong + ' · 超时 ' + timed.qTimeout;
    meaningEl.textContent = '点下方「重来一组」再抽一组';
    meaningEl.className = 'meaning show';
    optionsEl.classList.add('hidden');
    progressEl.textContent = labelOf(mode) + ' · 本组完成';
    statusEl.textContent = '错得越多的词会被多抽几次，直到答对为止';
  }

  // ---------- 导入题库（记录文件 / 当前记录） ----------
  function importTargets() {
    if (mode === 'quizUnknown' || mode === 'timedUnknown' || mode === 'memo') return ['unknown'];
    if (mode === 'timedMixed') return ['known', 'unknown'];
    return ['known'];
  }

  function restartQuizSession() {
    if (isMemo()) { openMemoPicker(); return; }
    if (isTimed()) timedStart(false);
    else quizStart();
  }

  function quizLoadFromRecord(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var rec = parseRecord(String(reader.result));
      if (!rec) { statusEl.textContent = '这个文件不是记录文件（缺少 #不认识/#认识 标记）'; return; }
      var targets = importTargets();
      var total = 0;
      for (var t = 0; t < targets.length; t++) {
        var cat = targets[t];
        var list = [];
        for (var i = 0; i < rec.recs.length; i++) {
          var r = rec.recs[i];
          if (r.cat === cat && r.m) list.push({ w: r.w, m: r.m, c: r.c });
        }
        if (cat === 'known') quizKnown.pool = list; else quizUnknown.pool = list;
        total += list.length;
      }
      if (total === 0) {
        statusEl.textContent = '「' + file.name + '」里没有本模式需要的词';
        return;
      }
      saveQuiz();
      restartQuizSession();
      statusEl.textContent = '已从「' + file.name + '」导入 ' + total + ' 个词，开始' + labelOf(mode);
    };
    reader.onerror = function () { statusEl.textContent = '读取文件失败'; };
    reader.readAsText(file, 'UTF-8');
  }

  function quizLoadFromCurrent() {
    var targets = importTargets();
    var total = 0;
    for (var t = 0; t < targets.length; t++) {
      var cat = targets[t];
      var list = [];
      for (var i = 0; i < words.length; i++) {
        if (answers[words[i].w] === cat && words[i].m) list.push({ w: words[i].w, m: words[i].m, c: words[i].c });
      }
      if (cat === 'known') quizKnown.pool = list; else quizUnknown.pool = list;
      total += list.length;
    }
    if (total === 0) {
      statusEl.textContent = '当前测试记录里还没有本模式需要的词';
      return;
    }
    saveQuiz();
    restartQuizSession();
    statusEl.textContent = '已用当前记录的 ' + total + ' 个词开始' + labelOf(mode);
  }

  // ================= 背单词：顺序版「不认识词」 =================
  var memo = {
    active: false, kind: 'card', list: [], idx: 0, label: '',
    qRight: 0, qWrong: 0, locked: false, revealed: false
  };
  var memoPick = { group: -1, words: [], label: '' };
  var memoTimer = 0;

  function isMemo() { return mode === 'memo'; }

  // 词库：优先用已导入/已保存的「不认识」题库，否则从当前测试记录里取
  function memoPool() {
    var pool = quizUnknown.pool || [];
    if (pool.length) return pool;
    var list = [];
    for (var i = 0; i < words.length; i++) {
      var w = words[i];
      if (answers[w.w] === 'unknown' && w.m) list.push({ w: w.w, m: w.m, c: w.c });
    }
    if (list.length) { quizUnknown.pool = list; saveQuiz(); }
    return list;
  }

  // 按出现次数分组（次数高的在前），组内保持原有顺序
  function memoGroups() {
    var pool = memoPool();
    var seen = {}, keys = [], map = {};
    for (var i = 0; i < pool.length; i++) {
      var w = pool[i];
      if (!w || !w.w || seen[w.w]) continue;
      seen[w.w] = true;
      var k = String(w.c || 0);
      if (!map[k]) { map[k] = { c: (w.c || 0), items: [] }; keys.push(k); }
      map[k].items.push(w);
    }
    var arr = [];
    for (var j = 0; j < keys.length; j++) arr.push(map[keys[j]]);
    arr.sort(function (a, b) { return b.c - a.c; });
    return arr;
  }

  function memoPreview(items) {
    var s = [], n = Math.min(3, items.length);
    for (var i = 0; i < n; i++) s.push(items[i].w);
    return s.join(' · ');
  }

  function renderMemoPicker() {
    var groups = memoGroups();
    var total = 0, html = [];
    for (var i = 0; i < groups.length; i++) total += groups[i].items.length;
    $('pickerStep1').classList.remove('hidden');
    $('pickerStep2').classList.add('hidden');

    if (!groups.length) {
      $('pickerHint').textContent = '还没有可背的词';
      $('pickerList').innerHTML = '<div class="empty" style="padding:26px 0;line-height:1.9;color:#90A4AE">' +
        '还没有「不认识」的词<br><span style="font-size:12px">先测试标记，或点下面导入记录 / 用当前记录</span></div>';
      return;
    }
    html.push('<button class="groupBtn" data-g="-1">' +
      '<span class="badge" style="background:#455A64">全部</span>' +
      '<span class="info"><b>全部词组</b><span>按出现次数从高到低连排</span></span>' +
      '<span class="num">' + total + ' 词</span></button>');
    for (var g = 0; g < groups.length; g++) {
      var grp = groups[g];
      html.push('<button class="groupBtn" data-g="' + g + '">' +
        '<span class="badge">' + grp.c + ' 次</span>' +
        '<span class="info"><b>出现 ' + grp.c + ' 次的词</b><span>' + esc(memoPreview(grp.items)) + '</span></span>' +
        '<span class="num">' + grp.items.length + ' 词</span></button>');
    }
    $('pickerHint').textContent = '共 ' + groups.length + ' 组 · ' + total + ' 个不认识的词';
    $('pickerList').innerHTML = html.join('');
  }

  function openMemoPicker() {
    memo.active = false;
    memo.list = [];
    memo.idx = 0;
    memo.locked = false;
    memo.revealed = false;
    if (memoTimer) { clearTimeout(memoTimer); memoTimer = 0; }
    navEl.classList.add('hidden');
    btnsEl.classList.add('hidden');
    memoBtns.classList.add('hidden');
    optionsEl.classList.add('hidden');
    timerEl.classList.add('hidden');
    footerMemo.classList.add('hidden');
    footerQuiz.classList.add('hidden');
    wordEl.textContent = '背单词';
    countEl.textContent = '顺序背「不认识」的词';
    meaningEl.textContent = '先选词组，再填要背的范围';
    meaningEl.className = 'meaning';
    progressEl.textContent = '背单词 · 顺序版';
    statusEl.textContent = '只会背标记为「不认识」的词';
    renderMemoPicker();
    pickerEl.classList.add('open');
  }

  function closeMemoPicker() { pickerEl.classList.remove('open'); }

  function memoCancelPicker() {
    closeMemoPicker();
    if (memo.active) {
      if (memo.kind === 'choice') memoRenderChoice();
      else memoRenderCard();
    } else {
      setMode('test');
    }
  }

  function memoChooseGroup(g) {
    var groups = memoGroups();
    var items;
    if (g < 0) {
      items = [];
      var seen = {};
      for (var i = 0; i < groups.length; i++) {
        for (var j = 0; j < groups[i].items.length; j++) {
          var w = groups[i].items[j];
          if (seen[w.w]) continue;
          seen[w.w] = true;
          items.push(w);
        }
      }
    } else {
      if (!groups[g]) return;
      items = groups[g].items;
    }
    if (!items.length) return;
    memoPick.group = g;
    memoPick.words = items;
    memoPick.label = (g < 0) ? '全部' : ('出现 ' + groups[g].c + ' 次');
    $('rangeTitle').textContent = memoPick.label + ' · 共 ' + items.length + ' 个词';
    $('rangeFrom').value = '1';
    $('rangeTo').value = String(items.length);
    updateMemoRangeHint();
    $('pickerStep1').classList.add('hidden');
    $('pickerStep2').classList.remove('hidden');
    try { $('rangeFrom').focus(); } catch (e) {}
  }

  // 范围解析：0 0 = 全部；0 = 该端默认；越界自动夹紧
  function memoRange() {
    var n = memoPick.words.length;
    var a = parseInt($('rangeFrom').value, 10);
    var b = parseInt($('rangeTo').value, 10);
    if (isNaN(a) || a < 0) a = 0;
    if (isNaN(b) || b < 0) b = 0;
    if (a === 0 && b === 0) { a = 1; b = n; }
    if (a === 0) a = 1;
    if (b === 0) b = n;
    if (a > n) a = n;
    if (b > n) b = n;
    if (b < a) { var t = a; a = b; b = t; }
    if (a < 1) a = 1;
    return { a: a, b: b };
  }

  function updateMemoRangeHint() {
    var n = memoPick.words.length;
    if (!n) return;
    var r = memoRange();
    $('rangeHint').innerHTML = '第 <b>' + r.a + '</b> 到第 <b>' + r.b + '</b>，共 <b>' +
      (r.b - r.a + 1) + '</b> 个（填 0 0 表示全部）';
  }

  function memoStartRange() {
    if (!memoPick.words.length) return;
    var r = memoRange();
    var list = memoPick.words.slice(r.a - 1, r.b);
    if (!list.length) return;
    memoStart(list, memoPick.label + ' ' + r.a + '~' + r.b);
  }

  function memoStart(list, label) {
    if (memoTimer) { clearTimeout(memoTimer); memoTimer = 0; }
    memo.active = true;
    memo.list = list;
    memo.idx = 0;
    memo.label = label;
    memo.qRight = 0;
    memo.qWrong = 0;
    memo.locked = false;
    memo.revealed = false;
    closeMemoPicker();
    footerMemo.classList.remove('hidden');
    $('memoKindBtn').textContent = (memo.kind === 'card') ? '切到选择题' : '切到卡片';
    if (memo.kind === 'choice') memoRenderChoice();
    else memoRenderCard();
    statusEl.textContent = '顺序背诵：' + label + '（共 ' + list.length + ' 个）';
  }

  function memoRenderCard() {
    var item = memo.list[memo.idx];
    if (!item) return;
    navEl.classList.add('hidden');
    btnsEl.classList.add('hidden');
    optionsEl.classList.add('hidden');
    memoBtns.classList.remove('hidden');
    wordEl.textContent = item.w;
    countEl.textContent = '出现次数：' + item.c;
    if (memo.revealed) {
      meaningEl.textContent = item.m ? item.m : '（无中文释义）';
      meaningEl.className = 'meaning show';
      $('memoReveal').textContent = '隐藏中文';
    } else {
      meaningEl.textContent = '想一想，再点「显示中文」';
      meaningEl.className = 'meaning';
      $('memoReveal').textContent = '显示中文';
    }
    $('memoPrev').disabled = (memo.idx === 0);
    $('memoNext').textContent = (memo.idx === memo.list.length - 1) ? '完成 ✓' : '下一个 →';
    progressEl.textContent = '背单词 · ' + memo.label + ' · 第 ' + (memo.idx + 1) + ' / ' + memo.list.length;
  }

  function memoRenderChoice() {
    var item = memo.list[memo.idx];
    if (!item) return;
    memo.locked = false;
    navEl.classList.remove('hidden');
    btnsEl.classList.add('hidden');
    memoBtns.classList.add('hidden');
    navBtns.prev.style.display = 'block';
    navBtns.next.style.display = 'block';
    navBtns.back.style.display = 'none';
    navBtns.restart.style.display = 'none';
    renderQuestion(item, '选出正确的中文意思');
    countEl.textContent = '选择题 · 对 ' + memo.qRight + ' · 错 ' + memo.qWrong;
    progressEl.textContent = '背单词 · ' + memo.label + ' · 第 ' + (memo.idx + 1) + ' / ' + memo.list.length;
  }

  function memoRevealToggle() {
    if (!memo.active || memo.kind !== 'card') return;
    memo.revealed = !memo.revealed;
    memoRenderCard();
  }

  function memoGo(d) {
    if (!memo.active) return;
    if (memoTimer) { clearTimeout(memoTimer); memoTimer = 0; }
    var ni = memo.idx + d;
    if (ni < 0) return;
    if (ni >= memo.list.length) { memoFinish(); return; }
    memo.idx = ni;
    memo.revealed = false;
    if (memo.kind === 'choice') memoRenderChoice();
    else memoRenderCard();
  }

  function memoAnswer(idx) {
    if (!memo.active || memo.locked) return;
    var item = memo.list[memo.idx];
    if (!item) return;
    var btn = optEls[idx];
    if (!btn || !btn.textContent) return;
    if (btn.textContent === item.m) {
      memo.locked = true;
      btn.className = 'correct';
      for (var i = 0; i < 4; i++) optEls[i].disabled = true;
      memo.qRight++;
      countEl.textContent = '选择题 · 对 ' + memo.qRight + ' · 错 ' + memo.qWrong;
      statusEl.textContent = '✓ 答对了：' + item.w + ' = ' + item.m;
      if (memoTimer) clearTimeout(memoTimer);
      memoTimer = setTimeout(function () {
        memoTimer = 0;
        if (!isMemo() || !memo.active) return;
        if (memo.idx + 1 >= memo.list.length) { memoFinish(); return; }
        memo.idx++;
        memo.revealed = false;
        memoRenderChoice();
      }, 750);
    } else {
      btn.className = 'wrong';
      btn.disabled = true;
      memo.qWrong++;
      countEl.textContent = '选择题 · 对 ' + memo.qRight + ' · 错 ' + memo.qWrong;
      statusEl.textContent = '✗ 再想想「' + item.w + '」的意思';
    }
  }

  function memoFinish() {
    if (memoTimer) { clearTimeout(memoTimer); memoTimer = 0; }
    memo.locked = true;
    navEl.classList.add('hidden');
    memoBtns.classList.add('hidden');
    optionsEl.classList.add('hidden');
    wordEl.textContent = '本轮完成 🎉';
    countEl.textContent = '共 ' + memo.list.length + ' 个词' +
      (memo.kind === 'choice' ? (' · 对 ' + memo.qRight + ' · 错 ' + memo.qWrong) : '');
    meaningEl.textContent = '点「换个词组」接着选，或「重来本轮」再走一遍';
    meaningEl.className = 'meaning show';
    progressEl.textContent = '背单词 · ' + memo.label + ' · 完成';
    statusEl.textContent = '顺序背完 ' + memo.list.length + ' 个词';
  }

  function memoToggleKind() {
    memo.kind = (memo.kind === 'card') ? 'choice' : 'card';
    saveQuiz();
    $('memoKindBtn').textContent = (memo.kind === 'card') ? '切到选择题' : '切到卡片';
    if (!memo.active) return;
    if (memoTimer) { clearTimeout(memoTimer); memoTimer = 0; }
    memo.revealed = false;
    memo.locked = false;
    if (memo.kind === 'choice') {
      memo.qRight = 0;
      memo.qWrong = 0;
      memoRenderChoice();
      statusEl.textContent = '已切换到选择题（顺序固定，不再打乱）';
    } else {
      memoRenderCard();
      statusEl.textContent = '已切换到卡片（点单词或按钮看中文）';
    }
  }

  function memoRestart() {
    if (!memo.active || !memo.list.length) return;
    if (memoTimer) { clearTimeout(memoTimer); memoTimer = 0; }
    memo.idx = 0;
    memo.revealed = false;
    memo.locked = false;
    memo.qRight = 0;
    memo.qWrong = 0;
    if (memo.kind === 'choice') memoRenderChoice();
    else memoRenderCard();
    statusEl.textContent = '已回到本轮第 1 个词';
  }

  // ================= 记录列表面板 =================
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderPanel() {
    var rows = [];
    for (var i = 0; i < words.length; i++) {
      var w = words[i];
      var cat = answers[w.w];
      if (!cat) continue;
      if (panelFilter !== 'all' && cat !== panelFilter) continue;
      var cls = (cat === 'known') ? 'k' : (cat === 'unknown') ? 'u' : 'v';
      rows.push('<div class="row" data-i="' + i + '">' +
        '<span class="dot ' + cls + '"></span>' +
        '<b>' + esc(w.w) + '</b>' +
        '<span class="m">' + esc(w.m) + '</span>' +
        '<span class="c">' + w.c + '次</span></div>');
    }
    panelTitle.textContent = '单词记录（' + doneCount() + '）';
    panelList.innerHTML = rows.length
      ? rows.join('')
      : '<div class="empty">还没有标记单词</div>';
  }

  function openPanel() {
    renderPanel();
    panel.classList.add('open');
  }

  function closePanel() {
    panel.classList.remove('open');
  }

  panelList.addEventListener('click', function (e) {
    var t = e.target;
    while (t && t !== panelList && !(t.getAttribute && t.getAttribute('data-i'))) t = t.parentNode;
    if (!t || t === panelList) return;
    var i = parseInt(t.getAttribute('data-i'), 10);
    if (isNaN(i)) return;
    closePanel();
    if (mode !== 'test') setMode('test');
    gotoIndex(i);
  });

  var filterBtns = panel.querySelectorAll('.filters button');
  for (var fi = 0; fi < filterBtns.length; fi++) {
    (function (btn) {
      btn.addEventListener('click', function () {
        panelFilter = btn.getAttribute('data-f');
        for (var x = 0; x < filterBtns.length; x++) filterBtns[x].classList.remove('active');
        btn.classList.add('active');
        renderPanel();
      });
    })(filterBtns[fi]);
  }

  // ================= 模式切换 / 菜单 =================
  function setMode(m) {
    mode = m;
    save();
    timerStop();
    timed.done = true;          // 切走时中止未完成的限时局
    var isTest = (m === 'test');
    var isMem = (m === 'memo');

    closeMemoPicker();
    if (memoTimer) { clearTimeout(memoTimer); memoTimer = 0; }
    memo.active = false;
    memo.list = [];
    memo.idx = 0;

    $('listBtn').classList.toggle('hidden', !isTest);
    $('jumpBtn').classList.toggle('hidden', !isTest);
    navEl.classList.toggle('hidden', !isTest);
    btnsEl.classList.toggle('hidden', !isTest);
    footerTest.classList.toggle('hidden', !isTest);
    footerQuiz.classList.toggle('hidden', isTest || isMem);
    footerMemo.classList.add('hidden');
    memoBtns.classList.add('hidden');
    optionsEl.classList.add('hidden');
    timerEl.classList.add('hidden');

    var items = menuEl.querySelectorAll('.menuItem');
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle('active', items[i].getAttribute('data-mode') === m);
    }

    if (isTest) { showCurrent(); }
    else if (isMem) { openMemoPicker(); }
    else if (isTimed()) {
      timed.done = false;
      $('quizShuffleBtn').textContent = '重来一组';
      timedStart(!groupSizeSaved);
    } else {
      $('quizShuffleBtn').textContent = '重排抽题';
      quizStart();
    }
  }

  function openMenu() { menuEl.classList.remove('hidden'); }
  function closeMenu() { menuEl.classList.add('hidden'); }

  $('menuBtn').addEventListener('click', openMenu);
  $('menuClose').addEventListener('click', closeMenu);
  menuEl.addEventListener('click', function (e) {
    if (e.target === menuEl) closeMenu();
  });
  var menuItems = menuEl.querySelectorAll('.menuItem');
  for (var mi = 0; mi < menuItems.length; mi++) {
    (function (btn) {
      btn.addEventListener('click', function () {
        closeMenu();
        setMode(btn.getAttribute('data-mode'));
      });
    })(menuItems[mi]);
  }

  // ================= 事件绑定 =================
  btnKnow.addEventListener('click', function () { answer('known'); });
  btnUnknown.addEventListener('click', function () { answer('unknown'); });
  navBtns.next.addEventListener('click', function () { if (isMemo()) memoGo(1); else goNext(); });
  navBtns.prev.addEventListener('click', function () { if (isMemo()) memoGo(-1); else goPrev(); });
  navBtns.back.addEventListener('click', goBack);
  navBtns.restart.addEventListener('click', resetAll);
  $('jumpBtn').addEventListener('click', jump);
  $('exportBtn').addEventListener('click', exportAll);
  $('resetBtn').addEventListener('click', resetAll);
  $('listBtn').addEventListener('click', openPanel);
  $('panelClose').addEventListener('click', closePanel);
  $('panelExport').addEventListener('click', exportAll);
  $('panelClear').addEventListener('click', resetAll);
  $('importBtn').addEventListener('click', function () { fileInputLib.click(); });
  $('panelImport').addEventListener('click', function () { fileInputRec.click(); });
  $('quizImportBtn').addEventListener('click', function () { fileInputQuiz.click(); });
  $('quizUseBtn').addEventListener('click', quizLoadFromCurrent);
  $('quizShuffleBtn').addEventListener('click', function () {
    if (poolForMode(mode).length === 0 && !isTimed()) {
      statusEl.textContent = '还没有词，先导入记录';
      return;
    }
    if (isTimed()) { timedStart(true); }
    else {
      var q = quizOf();
      quizResetDeck(q, poolForMode(mode));
      q.qTotal = 0; q.qRight = 0; q.qWrong = 0;
      quizNext(poolForMode(mode));
      statusEl.textContent = '已重新打乱抽题顺序';
    }
  });
  fileInputLib.addEventListener('change', function () {
    if (fileInputLib.files && fileInputLib.files[0]) importLibFile(fileInputLib.files[0]);
    fileInputLib.value = '';
  });
  fileInputRec.addEventListener('change', function () {
    if (fileInputRec.files && fileInputRec.files[0]) importRecFile(fileInputRec.files[0]);
    fileInputRec.value = '';
  });
  fileInputQuiz.addEventListener('change', function () {
    if (fileInputQuiz.files && fileInputQuiz.files[0]) quizLoadFromRecord(fileInputQuiz.files[0]);
    fileInputQuiz.value = '';
  });
  for (var oi = 0; oi < 4; oi++) {
    (function (idx) {
      optEls[idx].addEventListener('click', function () {
        if (isMemo()) memoAnswer(idx);
        else if (isTimed()) timedAnswer(idx);
        else if (mode !== 'test') quizAnswer(idx);
      });
    })(oi);
  }

  // ================= 背单词：事件绑定 =================
  $('memoPrev').addEventListener('click', function () { memoGo(-1); });
  $('memoNext').addEventListener('click', function () { memoGo(1); });
  $('memoReveal').addEventListener('click', memoRevealToggle);
  $('memoPickBtn').addEventListener('click', function () { openMemoPicker(); });
  $('memoKindBtn').addEventListener('click', memoToggleKind);
  $('memoRestartBtn').addEventListener('click', memoRestart);

  $('pickerClose').addEventListener('click', memoCancelPicker);
  pickerEl.addEventListener('click', function (e) {
    if (e.target === pickerEl) memoCancelPicker();
  });
  $('pickerList').addEventListener('click', function (e) {
    var t = e.target;
    while (t && t !== this && !(t.getAttribute && t.getAttribute('data-g'))) t = t.parentNode;
    if (!t || t === this) return;
    var g = parseInt(t.getAttribute('data-g'), 10);
    if (isNaN(g)) return;
    memoChooseGroup(g);
  });
  $('rangeFrom').addEventListener('input', updateMemoRangeHint);
  $('rangeTo').addEventListener('input', updateMemoRangeHint);
  $('rangeFrom').addEventListener('keydown', function (e) { if (e.key === 'Enter') memoStartRange(); });
  $('rangeTo').addEventListener('keydown', function (e) { if (e.key === 'Enter') memoStartRange(); });
  $('rangeStart').addEventListener('click', memoStartRange);
  $('rangeBack').addEventListener('click', function () {
    $('pickerStep2').classList.add('hidden');
    $('pickerStep1').classList.remove('hidden');
  });
  $('pickerImport').addEventListener('click', function () { fileInputQuiz.click(); });
  $('pickerUse').addEventListener('click', quizLoadFromCurrent);

  // 卡片模式：点单词区域也能翻中文
  cardEl.addEventListener('click', function () {
    if (isMemo() && memo.active && memo.kind === 'card') memoRevealToggle();
  });

  document.addEventListener('keydown', function (e) {
    if (!isMemo() || !memo.active) return;
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    if (e.key === 'ArrowLeft') { memoGo(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { memoGo(1); e.preventDefault(); }
    else if (e.key === ' ' || e.key === 'Spacebar') {
      if (memo.kind === 'card') { memoRevealToggle(); e.preventDefault(); }
    }
  });

  // ================= 启动 =================
  if (!restore()) {
    sourceText = $('worddata').textContent;
    words = parseText(sourceText);
    answers = {};
    pos = 0;
  }
  restoreQuiz();
  setMode(mode);
})();
</script>

</body>
</html>
